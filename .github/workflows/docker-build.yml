name: Build and Push Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tlr tests
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s tests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tiktok-live-lite:web
            ghcr.io/${{ github.repository_owner }}/tiktok-live-lite:web-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max